name: Build and Run Integration Tests

run-name: ${{ github.actor }} is building and testing OpenHIIT

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, pre-release]
    paths:
      - 'lib/**'
      - 'test_driver/**'
      - 'integration_test/**'
      - 'scripts/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/integration_tests.yaml'

# A new push makes the previous run of the same PR pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One emulator for all tests instead of a separate job (Flutter setup,
  # full build, emulator boot) per test file.
  run-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/.ghcup # Remove Haskell toolchain
          sudo rm -rf /opt/microsoft /opt/google # Remove browsers
          sudo rm -rf /usr/local/share/powershell # Remove PowerShell
          df -h .

      - run: flutter pub get

      # Warm up Gradle and catch build errors before the emulator boots.
      - name: Build debug APK
        run: flutter build apk --debug --target integration_test/simple_test.dart

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          # Android 16 emulator: the Android 17 (37.0) images don't finish
          # booting on GitHub runners within 10 minutes. The app itself is
          # still built against and targets API 37.
          api-level: 36
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/run_integration_tests.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
